<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Kinolar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Ranglarni shu yerdan o'zgartirasiz: --bg orqa fon, --s1/--s2/--s3 kartalar va tugmalar, --acc asosiy rang */
:root{--bg:#0b0b0d;--s1:#1b1c20;--s2:#25272c;--s3:#30333a;--line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);--text:#f3f5f6;--muted:#8d959c;--acc:#3ee6c0;--acc2:#22c3a2;--accink:#04201a;--red:#ff6b7d;--warn:#ffcf5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
body{padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
svg{width:20px;height:20px;flex:none;display:block}
svg.f{fill:currentColor}
svg.s{width:15px;height:15px}
svg.l{width:30px;height:30px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:var(--text);outline:none}
select option{color:#000}
#app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
/* kartalar: fondan ochroq, ingichka chiziq */
.glass{position:relative;background:var(--s1);border:1px solid var(--line);border-radius:22px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{margin:0;flex:1;text-align:center;font-size:20px;font-weight:800;letter-spacing:.2px}
.ib{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--s2);border:1px solid var(--line)}
.ib svg{width:21px;height:21px}
.sec{font-size:17px;font-weight:800;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec>span{display:flex;align-items:center;gap:8px}
.sec small{font-size:12px;color:var(--muted);font-weight:700}
.lab{font-size:12px;font-weight:800;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase}
.hero{padding:14px 0 14px 14px;margin-bottom:6px;overflow:hidden}
.hero .lab{margin:0 0 10px;display:flex;gap:8px;align-items:center;color:var(--acc)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 4px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tcard{flex:none;width:78%;scroll-snap-align:start;position:relative;text-align:left}
.rail.sm .tcard{width:46%}
.poster{position:relative;aspect-ratio:16/9;border-radius:16px;background:center/cover no-repeat var(--s2);overflow:hidden;width:100%}
.poster.np{display:flex;align-items:center;justify-content:center;color:var(--muted)}
.poster.np svg{width:38px;height:38px}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.7));pointer-events:none}
.poster.plain::after{display:none}
.rank{position:absolute;left:10px;bottom:32px;z-index:2;font-size:44px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:2px #fff;text-shadow:0 4px 14px rgba(0,0,0,.6)}
.ptitle{position:absolute;left:10px;right:10px;bottom:8px;z-index:2;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bds{position:absolute;left:8px;right:8px;top:8px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.bd{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:900;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.2)}
.bd.q{color:var(--acc);border-color:rgba(62,230,192,.5)}
.bd.q4{color:#ffd76a;border-color:rgba(255,215,106,.7)}
.bd.age{color:#ff8b98;border-color:rgba(255,107,125,.6);margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:14px;color:#c4cbd0;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip.on{background:var(--acc);color:var(--accink);border-color:transparent}
.list{display:grid;gap:14px}
.mcard{display:block;width:100%;padding:10px;text-align:left}
.mcard .mm{padding:10px 4px 2px}
.mcard .mm b{display:block;font-size:17px;margin-bottom:4px}
.mcard .mm small{color:var(--muted);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.mcard .mm small svg{width:14px;height:14px}
.mcard .tg{color:var(--acc);font-size:12px;margin-top:4px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kod{position:absolute;right:8px;bottom:8px;z-index:2;padding:3px 9px;border-radius:9px;background:var(--acc);color:var(--accink);font-weight:900;font-size:12px}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:10px;text-align:left;margin-bottom:10px;border-radius:18px}
.row .poster{width:112px;flex:none;border-radius:12px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.row .t .tg{color:var(--acc);font-weight:700}
.btn{padding:14px;border-radius:16px;font-weight:800;font-size:16px;text-align:center;border:1px solid var(--line);background:var(--s2);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s}
.btn.p{background:var(--acc);color:var(--accink);border-color:transparent}
.btn.d{color:var(--red)}
.btn.s{padding:10px 14px;font-size:14px;border-radius:13px;width:auto}
.btn.s svg{width:17px;height:17px}
.btn.on{background:rgba(62,230,192,.16);border-color:rgba(62,230,192,.5);color:var(--acc)}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{width:100%;padding:13px 15px;border-radius:14px;background:var(--bg);border:1px solid var(--line2);font-size:16px}
.field:focus{border-color:var(--acc)}
textarea.field{min-height:90px;resize:vertical}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin:14px 2px 6px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 2px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;line-height:1.6}
.tabs{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px;margin-bottom:14px;overflow:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{padding:10px 12px;border-radius:12px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;flex:1;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button svg{width:16px;height:16px}
.tabs button.on{background:var(--s3);color:var(--text)}
.pg{padding:16px;margin-bottom:12px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat3>*{padding:12px 8px;text-align:center;border-radius:18px;background:var(--s1);border:1px solid var(--line)}
.stat3 b{display:block;font-size:24px;color:var(--acc)}
.stat3 small{color:var(--muted);font-size:12px;font-weight:700}
.ava{width:60px;height:60px;border-radius:50%;background:center/cover,var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:var(--accink);flex:none;border:2px solid var(--line2)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tg-sw{width:52px;height:31px;border-radius:20px;background:var(--s3);position:relative;flex:none;transition:background .25s}
.tg-sw i{position:absolute;left:3px;top:3px;width:25px;height:25px;border-radius:50%;background:#fff;transition:transform .25s}
.tg-sw.on{background:var(--acc2)}.tg-sw.on i{transform:translateX(21px)}
.tg-sw:disabled{opacity:.4}
#nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
#nav .in{pointer-events:auto;width:min(calc(100% - 28px),500px);display:flex;padding:6px;gap:4px;border-radius:30px;background:var(--s1);border:1px solid var(--line2);box-shadow:0 10px 30px rgba(0,0,0,.6)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:24px;color:#aab2b8;font-size:12px;font-weight:700;text-align:center}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--acc);background:var(--s3)}
body.hidenav #nav{display:none}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:90%;padding:11px 18px;border-radius:14px;background:var(--s3);border:1px solid var(--line2);font-weight:700;font-size:14px;z-index:500;display:none;text-align:center}
/* qatlamlar */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.ov .in{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 40px}
.ov.p2{z-index:60}.ov.p3{z-index:80;background:#000}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* qidiruv satri (belgi o'lchami aniq berilgan) */
.sbox{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0 8px 0 14px;border-radius:15px;background:var(--s1);border:1px solid var(--line2);height:44px}
.sbox:focus-within{border-color:var(--acc)}
.sbox svg{width:19px;height:19px;color:var(--muted)}
.sbox input{flex:1;background:none;border:0;font-size:16px;min-width:0;height:100%}
.sbox .sclr{width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center;background:var(--s3)}
.sbox .sclr svg{width:14px;height:14px;color:var(--text)}
.sbox.has .sclr{display:flex}
.dtl .poster{border-radius:20px}
.dtl h1{font-size:24px;margin:14px 2px 6px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--s2);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.pill svg{width:15px;height:15px}
.pill.q{color:var(--acc);border-color:rgba(62,230,192,.45)}.pill.age{color:#ff8b98;border-color:rgba(255,107,125,.45)}
.pill.emo{background:rgba(255,207,92,.10);border-color:rgba(255,207,92,.35);color:var(--warn)}
.pill.tag{color:var(--acc)}
.descr{line-height:1.6;color:#d4dadd;font-size:15px;margin:10px 2px;white-space:pre-wrap}
.acts{display:grid;gap:10px;margin:14px 0}
.plr{position:relative;background:#000;aspect-ratio:16/9;width:100%;overflow:hidden}
.plr video,.plr iframe,.plr .ytw{width:100%;height:100%;display:block;background:#000;border:0}
.pad{position:absolute;left:0;right:0;top:0;height:32px;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;overflow:hidden}
.pv{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#000}
.pv .bar{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;display:flex;align-items:center;gap:10px}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-bottom:60px}
.adb{display:block;margin:0 12px;border-radius:16px;overflow:hidden;background:var(--s1);border:1px solid var(--line);position:relative;cursor:pointer;width:auto}
.adb img,.adb video{display:block;width:100%;max-height:190px;object-fit:cover}
.adb small{position:absolute;left:8px;top:6px;font-size:10px;font-weight:800;background:rgba(0,0,0,.65);padding:2px 7px;border-radius:6px;color:#fffd}
.plr.rot{position:fixed;top:0;left:0;width:100vh;width:100dvh;height:100vw;height:100dvw;aspect-ratio:auto;transform-origin:top left;transform:translateX(100vw) rotate(90deg);z-index:120}
.rbtn{display:none;position:absolute;right:10px;top:40px;z-index:6;width:auto}
.plr.rot .rbtn{display:flex}
.pad img,.pad video{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.pad .x{position:absolute;right:4px;top:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:5}
.pad .x svg{width:12px;height:12px}
.pad small{position:absolute;left:4px;top:2px;font-size:9px;font-weight:800;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:5px;color:#fffc}
.forced{position:absolute;inset:0;z-index:9;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.forced .fm{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.forced .fm img,.forced .fm video{max-width:100%;max-height:100%;object-fit:contain}
.forced .fb{display:flex;gap:8px;width:100%}
.forced .fb .btn{padding:9px;font-size:14px;border-radius:12px}
.sheet{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{width:min(100%,520px);padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));border-radius:24px 24px 0 0;background:var(--s1);border:1px solid var(--line2)}
.sheet h3{margin:0 0 8px;font-size:20px;display:flex;align-items:center;gap:8px}
.prev{width:100%;aspect-ratio:16/9;border-radius:14px;object-fit:cover;background:var(--bg) center/cover;display:flex;align-items:center;justify-content:center;color:var(--muted);border:1px solid var(--line)}
.prev svg{width:34px;height:34px}
.up{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;background:var(--s2)}
.up.on{border-color:var(--acc);background:rgba(62,230,192,.10)}
.up .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}
.up.on .r{border-color:var(--acc);background:radial-gradient(var(--acc) 45%,transparent 50%)}
.up b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up small{color:var(--muted);font-size:12px}
.emos{display:flex;flex-wrap:wrap;gap:8px}
.st{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:800;background:rgba(255,207,92,.15);color:var(--warn)}
.st.ok{background:rgba(62,230,192,.15);color:var(--acc)}.st.no{background:rgba(255,107,125,.15);color:var(--red)}
.seg{display:flex;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;margin:10px 0}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.seg button.on{background:var(--s3);color:var(--text)}
.inl{display:inline-flex;align-items:center;gap:6px}
.inl svg{width:15px;height:15px}
/* majburiy obuna ekrani */
.gate{position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto}
.gin{max-width:480px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 18px 40px;text-align:center}
.gico{width:74px;height:74px;border-radius:24px;margin:0 auto 16px;background:var(--s2);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--acc)}
.gico svg{width:34px;height:34px}
.gin h2{margin:0 0 8px;font-size:24px}
.gin p{margin:0 0 20px;color:var(--muted);line-height:1.55;font-size:15px}
.glist{display:grid;gap:10px;margin-bottom:18px}
.grow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--s1);border:1px solid var(--line);text-align:left;width:100%}
.grow>svg:first-child{color:var(--acc);width:24px;height:24px}
.grow .gt{flex:1;min-width:0}
.grow .gt b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .gt small{color:var(--muted);font-size:12px}
.grow>svg:last-child{color:var(--muted)}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow>svg:first-child{width:24px;height:24px;color:var(--acc)}
.crow .ct{flex:1;min-width:0}
.crow .ct b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .ct small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
</style>
</head>

<div id="app"></div>
<div id="nav"><div class="in"></div></div>
<div id="toast"></div>
<script>
(() => {

  /* fayl -> base64 */
  function readB64(file, maxBytes) {
    return new Promise((ok, bad) => {
      if (file.size > maxBytes) return bad(new Error("Fayl " + (maxBytes / 1e6).toFixed(1) + " MB dan oshmasin"));
      const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => bad(new Error("Fayl o‘qilmadi")); r.readAsDataURL(file);
    });
  }
  function posterB64(file) {              // 16:9 ga kesib, 960×540 JPEG qiladi
    return new Promise((ok, bad) => {
      if (!/^image\//.test(file.type)) return bad(new Error("Rasm tanlang"));
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        const W = 960, H = 540, c = document.createElement("canvas"); c.width = W; c.height = H;
        const k = Math.max(W / im.naturalWidth, H / im.naturalHeight), w = im.naturalWidth * k, hh = im.naturalHeight * k, x = c.getContext("2d");
        x.fillStyle = "#0b0b0d"; x.fillRect(0, 0, W, H); x.drawImage(im, (W - w) / 2, (H - hh) / 2, w, hh);
        URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.86).split(",")[1]);
      };
      im.onerror = () => { URL.revokeObjectURL(url); bad(new Error("Rasm o‘qilmadi")); };
      im.src = url;
    });
  }
  function adB64(file) {                  // reklama: GIF/MP4 o'z holicha, rasm kichraytiriladi
    if (/^(image\/gif|video\/mp4)$/.test(file.type)) return readB64(file, 6000000);
    return new Promise((ok, bad) => {
      if (!/^image\//.test(file.type)) return bad(new Error("Rasm, GIF yoki MP4 tanlang"));
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => { const k = Math.min(1, 1280 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.88).split(",")[1]); };
      im.onerror = () => { URL.revokeObjectURL(url); bad(new Error("Rasm o‘qilmadi")); }; im.src = url;
