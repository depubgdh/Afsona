<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1315">
<title>Kinolar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a1315;--line:rgba(255,255,255,.13);--text:#eef6f4;--muted:#8fa6a1;--acc:#3ee6c0;--acc2:#1fb897;--red:#ff6b7d;--warn:#ffcf5c}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
body{background:radial-gradient(120% 60% at 50% -10%,#143a38 0,#0a1315 60%) fixed;padding-bottom:calc(104px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,textarea,select{font:inherit;color:var(--text);outline:none}
select option{color:#000}
#app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1.5px solid var(--line);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08)}
/* yonib turuvchi hoshiya faqat asosiy kartada va tugmalarda (qotmasligi uchun) */
.glow::before{content:"";position:absolute;inset:-1.5px;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:2;
  background:conic-gradient(from var(--a),transparent 0 58%,rgba(62,230,192,.15) 66%,rgba(62,230,192,.95) 84%,#c9fff4 89%,transparent 95%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite}
@keyframes spin{to{--a:360deg}}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{margin:0;flex:1;text-align:center;font-size:21px;letter-spacing:.3px}
.ib{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.ib svg{width:22px;height:22px}
.sec{font-size:18px;font-weight:900;margin:22px 2px 10px;display:flex;align-items:center;justify-content:space-between}
.sec small{font-size:12px;color:var(--muted);font-weight:700}
.lab{font-size:12px;font-weight:800;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.hero{padding:14px 0 14px 14px;margin-bottom:6px;overflow:hidden}
.hero .lab{margin:0 0 10px;display:flex;gap:8px;align-items:center}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 14px 4px 0;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.tcard{flex:none;width:78%;scroll-snap-align:start;position:relative;text-align:left}
.rail.sm .tcard{width:46%}
.poster{position:relative;aspect-ratio:16/9;border-radius:18px;background:center/cover no-repeat #11262a;overflow:hidden;width:100%}
.poster.np{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#17423f,#0d1d28);font-size:38px}
.poster::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.78));pointer-events:none}
.poster.plain::after{display:none}
.rank{position:absolute;left:10px;bottom:34px;z-index:2;font-size:46px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:2px #fff;text-shadow:0 4px 14px rgba(0,0,0,.6)}
.ptitle{position:absolute;left:10px;right:10px;bottom:8px;z-index:2;font-weight:800;font-size:15px;text-shadow:0 2px 6px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bds{position:absolute;left:8px;right:8px;top:8px;z-index:2;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.bd{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:900;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px)}
.bd.q{color:var(--acc);border-color:rgba(62,230,192,.55)}
.bd.q4{color:#ffd76a;border-color:rgba(255,215,106,.7)}
.bd.age{color:#ff8b98;border-color:rgba(255,107,125,.6);margin-left:auto}
.bd.l{color:#cfe}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.05);font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.chip.on{background:linear-gradient(145deg,#6ff2d4,#2fcfae);color:#05231c;border-color:transparent;box-shadow:0 0 16px rgba(62,230,192,.45)}
.list{display:grid;gap:14px}
.mcard{display:block;width:100%;padding:10px;text-align:left}
.mcard .mm{padding:10px 4px 2px}
.mcard .mm b{display:block;font-size:17px;margin-bottom:3px}
.mcard .mm small{color:var(--muted);font-size:12.5px;font-weight:600}
.mcard .tg{color:var(--acc);font-size:12px;margin-top:4px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kod{position:absolute;right:8px;bottom:8px;z-index:2;padding:3px 9px;border-radius:9px;background:rgba(62,230,192,.9);color:#05231c;font-weight:900;font-size:12px}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:10px;text-align:left;margin-bottom:10px;border-radius:20px}
.row .poster{width:112px;flex:none;border-radius:12px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:15px;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.row .t .tg{color:var(--acc);font-weight:700}
.btn{padding:15px;border-radius:18px;font-weight:900;font-size:16px;text-align:center;border:1.5px solid var(--line);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;gap:8px;width:100%;position:relative;overflow:hidden;transition:transform .15s}
.btn.p{background:linear-gradient(145deg,#7ff5da,#2fcfae);color:#05231c;border-color:rgba(255,255,255,.4);box-shadow:0 0 18px rgba(62,230,192,.35);animation:bg 3.6s ease-in-out infinite}
@keyframes bg{50%{box-shadow:0 0 28px rgba(62,230,192,.55)}}
.btn.d{color:var(--red)}
.btn.s{padding:10px 14px;font-size:14px;border-radius:14px;width:auto}
.btn.on{background:rgba(62,230,192,.18);border-color:rgba(62,230,192,.55);color:var(--acc)}
.btn:disabled{opacity:.45}
.btn:active{transform:scale(.98)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{width:100%;padding:13px 15px;border-radius:15px;background:rgba(0,0,0,.4);border:1.5px solid var(--line);font-size:16px}
.field:focus{border-color:rgba(62,230,192,.6)}
textarea.field{min-height:90px;resize:vertical}
.lbl{font-size:13px;color:var(--muted);font-weight:700;margin:14px 2px 6px}
.note{font-size:13px;color:var(--muted);line-height:1.5;margin:8px 2px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.tabs{display:flex;background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:18px;padding:5px;gap:4px;margin-bottom:14px;overflow:auto}
.tabs button{padding:10px 8px;border-radius:13px;font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap;flex:1;text-align:center}
.tabs button.on{background:linear-gradient(145deg,#6ff2d4,#2fcfae);color:#05231c;box-shadow:0 0 16px rgba(62,230,192,.5)}
.pg{padding:16px;margin-bottom:12px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stat3 .glass{padding:12px 8px;text-align:center;border-radius:20px}
.stat3 b{display:block;font-size:24px;color:var(--acc)}
.stat3 small{color:var(--muted);font-size:12px;font-weight:700}
.ava{width:60px;height:60px;border-radius:50%;background:center/cover,linear-gradient(145deg,var(--acc),var(--acc2));border:2px solid rgba(62,230,192,.6);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#06201a;flex:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.sw small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tg-sw{width:54px;height:32px;border-radius:20px;background:rgba(255,255,255,.14);position:relative;flex:none;transition:background .25s}
.tg-sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .25s}
.tg-sw.on{background:var(--acc2)}.tg-sw.on i{transform:translateX(22px)}
#nav{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20}
#nav .in{pointer-events:auto;width:min(calc(100% - 28px),500px);display:flex;padding:7px;gap:4px;border-radius:34px;background:linear-gradient(145deg,rgba(30,50,50,.92),rgba(10,20,22,.92));border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;border-radius:28px;color:#b6c8c4;font-size:12.5px;font-weight:700;text-align:center}
#nav button svg{width:26px;height:26px}
#nav button.on{color:var(--acc);background:linear-gradient(145deg,rgba(62,230,192,.25),rgba(62,230,192,.08));border:1.5px solid rgba(62,230,192,.5)}
body.hidenav #nav{display:none}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:90%;padding:11px 18px;border-radius:16px;background:rgba(20,30,32,.96);border:1.5px solid var(--line);font-weight:700;font-size:14px;z-index:200;display:none;text-align:center}
/* qatlamlar: kino sahifasi, qidiruv, pleyer */
.ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;background:radial-gradient(120% 50% at 50% -10%,#143a38 0,#0a1315 60%)}
.ov .in{max-width:520px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 40px}
.ov.p2{z-index:60}.ov.p3{z-index:80;background:#000}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hd h2{margin:0;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sbox{display:flex;align-items:center;gap:8px;flex:1;padding:0 14px;border-radius:16px;background:rgba(0,0,0,.4);border:1.5px solid rgba(62,230,192,.5);height:46px}
.sbox input{flex:1;background:none;border:0;font-size:16px;min-width:0}
.dtl .poster{border-radius:22px}
.dtl h1{font-size:24px;margin:14px 2px 6px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.pill{padding:6px 12px;border-radius:999px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);font-size:13px;font-weight:700}
.pill.q{color:var(--acc);border-color:rgba(62,230,192,.5)}.pill.age{color:#ff8b98;border-color:rgba(255,107,125,.5)}
.pill.emo{background:rgba(255,207,92,.12);border-color:rgba(255,207,92,.4);color:var(--warn)}
.pill.tag{color:var(--acc)}
.descr{line-height:1.6;color:#d4e2df;font-size:15px;margin:10px 2px;white-space:pre-wrap}
.acts{display:grid;gap:10px;margin:14px 0}
.plr{position:relative;background:#000;aspect-ratio:16/9;width:100%}
.plr video{width:100%;height:100%;display:block;background:#000}
.pad{position:absolute;left:0;right:0;bottom:44px;height:56px;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:4;overflow:hidden}
.pad img,.pad video{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.pad .x{position:absolute;right:4px;top:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.8);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;z-index:5}
.pad small{position:absolute;left:4px;top:2px;font-size:9px;font-weight:800;background:rgba(0,0,0,.7);padding:1px 5px;border-radius:5px;color:#fffc}
.forced{position:absolute;inset:0;z-index:9;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
.forced .fm{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.forced .fm img,.forced .fm video{max-width:100%;max-height:100%;object-fit:contain}
.forced .fb{display:flex;gap:8px;width:100%}
.forced .fb .btn{padding:9px;font-size:14px;border-radius:12px}
.sheet{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{width:min(100%,520px);padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));border-radius:26px 26px 0 0;background:#10201f;border:1.5px solid var(--line)}
.sheet h3{margin:0 0 8px;font-size:20px}
.prev{width:100%;aspect-ratio:16/9;border-radius:14px;object-fit:cover;background:#000;display:block}
.up{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:14px;border:1.5px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.up.on{border-color:rgba(62,230,192,.7);background:rgba(62,230,192,.1)}
.up .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none}
.up.on .r{border-color:var(--acc);background:radial-gradient(var(--acc) 45%,transparent 50%)}
.up b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up small{color:var(--muted);font-size:12px}
.emos{display:flex;flex-wrap:wrap;gap:8px}
.st{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;font-weight:800;background:rgba(255,207,92,.15);color:var(--warn)}
.st.ok{background:rgba(62,230,192,.15);color:var(--acc)}.st.no{background:rgba(255,107,125,.15);color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<div id="nav"><div class="in"></div></div>
<div id="toast"></div>
<script>
(() => {
  "use strict";
  const tg = window.Telegram && Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0a1315"); tg.setBackgroundColor && tg.setBackgroundColor("#0a1315"); } catch (e) {} }
  const qs = new URLSearchParams(location.search);
  const DEV = qs.get("dev") === "1";
  const S = { me: null, tab: "movies", home: null, tag: "", list: [], total: 0, plist: "like", pitems: null, uploads: null, mine: null, admin: { tab: "movies" } };
  const app = document.getElementById("app");

  /* ---------- yordamchilar ---------- */
  function add(e, kids) { for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; e.appendChild(c.nodeType ? c : document.createTextNode(String(c))); } return e; }
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k]; if (v == null || v === false) continue;
      if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else if (k.startsWith("on")) e[k] = v; else if (k === "value") e.value = v; else e.setAttribute(k, v === true ? "" : v);
    }
    return add(e, kids);
  }
  const svg = (p) => { const d = document.createElement("div"); d.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + "</svg>"; return d.firstChild; };
  const IC = {
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', film: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>', plus: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/>',
    gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    back: '<path d="M15 18l-6-6 6-6"/>'
  };
  let toastT = 0;
  function toast(t) { const e = document.getElementById("toast"); e.textContent = t; e.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => { e.style.display = "none"; }, 2600); }
  function haptic() { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred("light"); } catch (e) {} }
  async function api(path, body) {
    const headers = { "Content-Type": "application/json" };
    if (DEV && qs.get("as")) headers["X-Dev-User"] = qs.get("as");
    const r = await fetch("/api/" + path, { method: "POST", headers, body: JSON.stringify(Object.assign({ init_data: tg ? tg.initData : "" }, body || {})) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(j.message || "Xatolik"); e.code = j.error; throw e; }
    return j;
  }
  const fail = (e) => toast(e && e.message || "Xatolik");
  function openLink(u) { if (!u) return; try { if (/^https?:\/\/t\.me\//i.test(u) && tg && tg.openTelegramLink) return tg.openTelegramLink(u); if (tg && tg.openLink) return tg.openLink(u); } catch (e) {} window.open(u, "_blank"); }
  const nf = (n) => String(n || 0).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const dur = (s) => { s = s | 0; if (!s) return ""; const hh = (s / 3600) | 0, mm = ((s % 3600) / 60) | 0; return hh ? hh + " soat " + mm + " daq" : mm + " daq"; };
  const size = (b) => !b ? "" : b > 1073741824 ? (b / 1073741824).toFixed(1) + " GB" : (b / 1048576).toFixed(0) + " MB";
  const EMO = {}; const emo = (k) => EMO[k] || "🏷";
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

  /* Telegram "orqaga" tugmasi: ochiq qatlamlarni ketma-ket yopadi */
  const BK = [];
  function pushBack(fn) { BK.push(fn); syncBack(); }
  function dropBack(fn) { const i = BK.lastIndexOf(fn); if (i >= 0) BK.splice(i, 1); syncBack(); }
  function syncBack() { try { if (tg && tg.BackButton) BK.length ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {} document.body.classList.toggle("lock", BK.length > 0); }
  try { tg && tg.BackButton && tg.BackButton.onClick(() => { const f = BK[BK.length - 1]; if (f) f(); }); } catch (e) {}
  function overlay(cls, build) {          // build(close) -> tugunlar
    const o = h("div", { class: "ov " + (cls || "") });
    const close = () => { dropBack(close); o.remove(); if (o.onclose) o.onclose(); };
    o.appendChild(build(close, o)); document.body.appendChild(o); pushBack(close); return { o, close };
  }

  /* fayl -> base64 */
  function readB64(file, maxBytes) {
    return new Promise((ok, bad) => {
      if (file.size > maxBytes) return bad(new Error("Fayl " + (maxBytes / 1e6).toFixed(1) + " MB dan oshmasin"));
      const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = () => bad(new Error("Fayl o‘qilmadi")); r.readAsDataURL(file);
    });
  }
  function posterB64(file) {              // 16:9 ga kesib, 960×540 JPEG qiladi
    return new Promise((ok, bad) => {
      if (!/^image\//.test(file.type)) return bad(new Error("Rasm tanlang"));
      const url = URL.createObjectURL(file), im = new Image();
